name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"] # v1.2 or 1.2: both publish a release
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all platforms and safety checks
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
      ui: ${{ steps.scope.outputs.ui }}
      memory: ${{ steps.scope.outputs.memory }}
      tsan: ${{ steps.scope.outputs.tsan }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      valgrind: ${{ steps.scope.outputs.valgrind }}
      media: ${{ steps.scope.outputs.media }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Linux dependency setup syntax
        run: shellcheck .github/scripts/configure_linux_apt.sh
      - name: Test change routing
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_scope.py'
      - name: Test release metadata and tag versions
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_metadata.py'
      - name: Select validation
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || false }}
        run: python3 .github/scripts/ci_scope.py

  # The test media, made once with Ubuntu's ffmpeg program (it has every encoder the tests need: x264, HAP…) and
  # handed to the three platforms
  media:
    if: needs.scope.outputs.media == 'true'
    needs: scope
    name: Test media
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sh test/make_media.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: test/media
          retention-days: 1

  linux:
    if: needs.scope.outputs.build == 'true'
    name: Linux (Ubuntu 24.04) + tests
    runs-on: ubuntu-24.04
    needs: [scope, media]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev qt6-svg-dev qt6-webengine-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libasound2-dev libasound2-plugins ffmpeg xvfb clang zlib1g-dev libavahi-client3 libpulse0 libssl3t64 libicu74 \
            nasm libdav1d-dev libva-dev libdrm-dev libssl-dev libsrt-openssl-dev qt6-wayland qt6-image-formats-plugins python3-pil \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good fonts-dejavu-core
      - name: Prepare clean Ubuntu runtime images
        timeout-minutes: 15
        run: |
          # Network setup has its own budget, separate from package execution.
          for ubuntu_version in 24.04 26.04; do
            timeout 420 docker build --progress=plain -t "nyxmap-clean-runtime:$ubuntu_version" \
              --secret id=ubuntu-ca,src=/etc/ssl/certs/ca-certificates.crt \
              --build-arg "UBUNTU_VERSION=$ubuntu_version" \
              -f packaging/linux/smoke.Dockerfile packaging/linux
          done
      - uses: actions/setup-dotnet@v4 # OMT: libomt is built with .NET Native AOT
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache/restore@v4
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg-lgpl-linux
          key: ffmpeg-lgpl-linux-ubuntu24-x86_64-${{ hashFiles('scripts/build_ffmpeg_linux.py') }}
      - name: Shared LGPL FFmpeg
        run: |
          python3 scripts/build_ffmpeg_linux.py "$HOME/ffmpeg-lgpl-linux"
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-lgpl-linux/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/ffmpeg-lgpl-linux/lib" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: ~/ffmpeg-lgpl-linux
          key: ffmpeg-lgpl-linux-ubuntu24-x86_64-${{ hashFiles('scripts/build_ffmpeg_linux.py') }}
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          cmake --build build --target nyxmap_tests -j4
      - name: Engine tests
        run: |
          # Deterministic areas once; timing failures gate on their first attempt, with diagnostic rerun only
          xvfb-run -a ctest --test-dir build --output-on-failure --timeout 900 -LE timing
          python3 scripts/run_timing_tests.py xvfb-run -a ctest --test-dir build --output-on-failure --timeout 900 -L timing
      - name: Backtraces of the crashed tests
        if: failure()
        run: |
          # Each failed engine area again under gdb: where it crashed (the symbols of a release build: functions only)
          sudo apt-get install -y gdb
          for name in $(sed -n 's/^[0-9]*:\(.*\)$/\1/p' build/Testing/Temporary/LastTestsFailed*.log | sort -u); do
            ctest --test-dir build -N -V -R "^${name}\$" | grep -q 'Test command: .*nyxmap_tests.*--area' || continue
            echo "::group::gdb $name"
            (cd build && timeout 600 xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt 30' --args ./nyxmap_tests --area "$name") || true
            echo "::endgroup::"
          done
      - name: Dependency versions
        run: |
          # The build machine only (package_linux.py labels it so). Ubuntu's FFmpeg (GPL) makes the test fixtures and is
          # neither linked nor shipped: the package's LGPL FFmpeg, Qt and the other libraries are recorded by the packaging
          {
            echo "Built on $(lsb_release -ds) $(uname -m), commit $GITHUB_SHA"
            dpkg-query -W -f='${Package} ${Version}\n' qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-webengine-dev libasound2-dev cmake gcc
          } | tee deps-linux.txt
      - name: Package autonomous Linux distributions
        run: |
          python3 scripts/build_omt.py "$RUNNER_TEMP/omt"
          python3 scripts/fetch_ndi.py "$RUNNER_TEMP/ndi"
          python3 scripts/package_linux.py build "$HOME/ffmpeg-lgpl-linux" "$RUNNER_TEMP/omt" "$RUNNER_TEMP/ndi" "$PWD/dist"
      - name: Clean Ubuntu runtime smoke test (no Qt, FFmpeg, .NET or FUSE)
        timeout-minutes: 15
        run: |
          # Only distribution files, fixtures and the test harness cross this boundary.
          mkdir -p "$RUNNER_TEMP/linux-packages" "$RUNNER_TEMP/linux-smoke-scripts"
          cp dist/NyxMap-linux-x86_64*.AppImage dist/NyxMap-linux-x86_64*.tar.gz "$RUNNER_TEMP/linux-packages/"
          cp scripts/smoke_package.py scripts/smoke_linux_package.py "$RUNNER_TEMP/linux-smoke-scripts/"
          for ubuntu_version in 24.04 26.04; do
            docker run --rm --init --network none \
              -v "$RUNNER_TEMP/linux-packages:/packages:ro" \
              -v "$RUNNER_TEMP/linux-smoke-scripts:/scripts:ro" \
              -v "$PWD/test/media:/media:ro" \
              "nyxmap-clean-runtime:$ubuntu_version" python3 -u /scripts/smoke_linux_package.py /packages /media /tmp/check
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NyxMap-linux
          path: |
            dist/NyxMap-linux-x86_64*.AppImage
            dist/NyxMap-linux-x86_64*.tar.gz

  workspace-memory:
    if: needs.scope.outputs.memory == 'true'
    needs: scope
    name: Workspace memory safety (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev qt6-svg-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libswresample-dev \
            libavutil-dev libasound2-dev xvfb
      - name: Build with AddressSanitizer
        timeout-minutes: 15
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan --target nyxmap_workspace_ui_test -j4
      - name: Exercise workspace lifetime
        timeout-minutes: 5
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          LP_NUM_THREADS: '1'
          NYXMAP_UI_CAPTURE_DIR: ${{ runner.temp }}/animation-transport
        run: xvfb-run -a ctest --test-dir build-asan --output-on-failure --timeout 120 -R '^(workspace_ui|xy_parameter_ui|color_parameter_ui|clock_preset_ui|system_isf_ui)$'
      - name: Animation transport screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-transport
          path: ${{ runner.temp }}/animation-transport
          retention-days: 7

  workspace-valgrind:
    if: needs.scope.outputs.valgrind == 'true'
    needs: scope
    name: Workspace allocation lifetime (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev qt6-svg-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libswresample-dev \
            libavutil-dev libasound2-dev xvfb valgrind
      - name: Build with debug symbols
        run: |
          cmake -S . -B build-memory -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-memory --target nyxmap_workspace_ui_test -j4
      - name: Check workspace allocation lifetime
        run: |
          xvfb-run -a valgrind --tool=memcheck --error-exitcode=99 \
            --undef-value-errors=no --show-realloc-size-zero=no --leak-check=no --num-callers=35 \
            --suppressions=test/valgrind.supp \
            --log-file=workspace-valgrind.log ./build-memory/nyxmap_workspace_ui_test
      - name: Memory diagnostics
        if: always()
        run: cat workspace-valgrind.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-memory-diagnostics
          path: workspace-valgrind.log

  # The threads that share data (decoders, sound callback, OSC) under ThreadSanitizer: a race in NyxMap's code
  # fails the job. Libraries not built with it (Qt, Mesa, FFmpeg) are suppressed in test/tsan.supp; the engine's
  # Qt mutexes and the render thread's join are annotated (src/engine/AnnotatedMutex.h).
  tsan:
    if: needs.scope.outputs.tsan == 'true'
    name: ThreadSanitizer (video, sound, OSC)
    runs-on: ubuntu-24.04
    needs: [scope, media]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-18 libclang-rt-18-dev qt6-base-dev libqt6opengl6-dev \
            qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev \
            libswresample-dev libavutil-dev libasound2-dev xvfb
      - name: Build
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_C_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan --target nyxmap_tests nyxmap_audio_analysis_concurrency_test nyxmap_publishing_concurrency_test nyxmap_cue_dispatch_test -j4
      - name: Tests under ThreadSanitizer
        run: |
          export TSAN_OPTIONS="halt_on_error=1 exitcode=66 suppressions=$PWD/test/tsan.supp"
          ctest --test-dir build-tsan -R '^audio_analysis_concurrency$' --output-on-failure
          xvfb-run -a ctest --test-dir build-tsan -R '^(publishing_concurrency|cue_dispatch)$' --output-on-failure
          timeout 120 xvfb-run -a ./build-tsan/nyxmap_tests --area cue_lifecycle
          # The decoders' threads, the sound callback and its decode threads, the OSC server. (The render-thread areas
          # render with llvmpipe, itself far too slow under ThreadSanitizer on a CI runner: run them locally.)
          # A sanitizer report (exit code 66, including a fatal signal) fails at once. Other failures can be timing checks under ThreadSanitizer's
          # slowness (the sound clocks): tried up to 3 times, a real regression fails every time
          for area in sound video osc; do
            echo "::group::$area"
            start=$(date +%s)
            ok=0
            for attempt in 1 2 3; do
              rc=0
              timeout 600 xvfb-run -a ./build-tsan/nyxmap_tests --area $area || rc=$?
              if [ $rc -eq 0 ]; then ok=1; break; fi
              if [ $rc -eq 66 ]; then echo "::error::ThreadSanitizer: race or fatal runtime error in area $area"; exit 66; fi
              echo "::warning::$area failed (exit $rc) under ThreadSanitizer, attempt $attempt of 3"
            done
            echo "$area: $(( $(date +%s) - start )) s"
            echo "::endgroup::"
            [ $ok -eq 1 ] || exit 1
          done

  # The interface itself, driven by xdotool on Xvfb with a window manager (test/ui_test.sh): opening a project,
  # relinking, undo, dragging, fullscreen, blackout, autosave, a forced kill and the recovery. Fails if the
  # application exits on its own or the recovery does not come; the screenshots are kept.
  ui:
    if: needs.scope.outputs.ui == 'true'
    name: Interface scenario (Linux)
    runs-on: ubuntu-24.04
    needs: [scope, media]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev qt6-svg-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libasound2-dev xvfb openbox xdotool imagemagick x11-apps x11-utils python3
      - name: Build
        timeout-minutes: 15
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target NyxMap -j4
      - name: Scenario
        timeout-minutes: 5
        run: |
          python3 test/make_tests.py
          bash test/ui_test.sh "$PWD/ui-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-out
          retention-days: 7

  # The HAP and Snappy readers against damaged files: a short libFuzzer run with ASan / UBSan, seeded with the
  # HAP frames of the test media (test/fuzz_hap.cpp). A crash fails the job and its input is kept as an artifact.
  fuzz:
    if: needs.scope.outputs.fuzz == 'true'
    name: Fuzzing (HAP, Snappy, OSC)
    # libFuzzer's default per-input timeout is 1200 s, and a fork-mode child stuck on one input is not stopped by
    # -max_total_time: a 1-minute OSC run once stayed up for over 20 minutes. Per input: 10 s (a timeout becomes a
    # finding, its input kept); for the job: a hard ceiling
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [scope, media]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        timeout-minutes: 10
        run: |
          bash .github/scripts/configure_linux_apt.sh
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-18 libclang-rt-18-dev qt6-base-dev libqt6opengl6-dev \
            qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev libavformat-dev libavcodec-dev libswscale-dev libswresample-dev \
            libavutil-dev ffmpeg
      - name: Build
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DNYXMAP_FUZZ=ON
          cmake --build build-fuzz --target fuzz_hap fuzz_osc -j4
      - name: Fuzz (2 minutes)
        run: |
          sh test/make_fuzz_corpus.sh "$PWD/fuzz_corpus"
          mkdir -p fuzz_crashes
          ./build-fuzz/fuzz_hap -fork=4 -max_total_time=120 -timeout=10 -rss_limit_mb=4096 -artifact_prefix=fuzz_crashes/ fuzz_corpus
      - name: Fuzz OSC (1 minute)
        run: |
          mkdir -p fuzz_crashes
          ./build-fuzz/fuzz_osc -fork=4 -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=fuzz_crashes/osc- fuzz_corpus/osc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz_crashes

  macos:
    if: needs.scope.outputs.build == 'true'
    name: macOS (Apple Silicon) + tests
    runs-on: macos-15
    needs: [scope, media]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        # Homebrew's qt includes Qt WebEngine (the Web Page generator) on macOS 14 or later
        run: brew install qt ffmpeg pkg-config
      - uses: actions/setup-dotnet@v4 # OMT: libomt is built with .NET Native AOT
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: |
          # Keep packaging independent of any stale build artifacts.
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DNYXMAP_ACCEPT_TOUCHENGINE_LICENSE=ON
          cmake --build build -j4
          cmake --build build --target nyxmap_tests -j4
      - name: macOS source build starts before packaging
        run: |
          codesign --verify --deep --strict build/runtimes/touchengine/TouchEngine.framework
          codesign --verify --deep --strict build/NyxMap.app/Contents/Frameworks/TouchEngine.framework
          ./build/NyxMap.app/Contents/MacOS/NyxMap --help
      - name: Engine tests
        run: |
          ctest --test-dir build --output-on-failure --timeout 900 -LE timing
          python3 scripts/run_timing_tests.py ctest --test-dir build --output-on-failure --timeout 900 -L timing
      - name: Dependency versions
        run: |
          { echo "Built on macOS $(sw_vers -productVersion) $(uname -m), commit $GITHUB_SHA"; brew list --versions qt ffmpeg; } \
            | tee deps-macos.txt
          echo "TouchEngine macOS SDK c3ceb1ab540db44dbfed4fb1bdb7bbfbb0305962 (Shared Use License; licenses/touchengine.txt)" >> deps-macos.txt
      - name: Homebrew FFmpeg version
        id: ffmpeg
        run: echo "version=$(brew list --versions ffmpeg | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg.outputs.version }}-${{ hashFiles('scripts/build_ffmpeg_lgpl.py') }}
      - name: FFmpeg without GPL components, for the package
        run: |
          # Homebrew's is built with --enable-gpl (x264, x265): the package ships the same version rebuilt LGPL,
          # in place of Homebrew's libraries from here on (the tests above ran with Homebrew's)
          python3 scripts/build_ffmpeg_lgpl.py build ~/ffmpeg-lgpl
          python3 scripts/build_ffmpeg_lgpl.py replace ~/ffmpeg-lgpl
          { echo; echo "FFmpeg in the package: built from source without GPL components (LGPL v2.1 or later)"; \
            cat ~/ffmpeg-lgpl/VERSION; } | tee -a deps-macos.txt
      - name: Package .app with runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          APP="build/NyxMap.app"
          EXE="$APP/Contents/MacOS/NyxMap"
          QT_PREFIX="$(brew --prefix qt)"

          test -d "$APP"
          test -f "$EXE"

          # macdeployqt preserves Qt's framework layout and handles its plugin deployment.
          # Supply FFmpeg and every Homebrew runtime dependency as extra search paths,
          # so its recursive dependency scan can copy them into the app bundle.
          LIBPATH_ARGS=("-libpath=$QT_PREFIX/lib")
          # Search every installed Homebrew formula: Qt's frameworks and FFmpeg's
          # transitive libraries can come from different formula dependency trees.
          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            prefix="$(brew --prefix "$formula")"
            [[ -d "$prefix/lib" ]] && LIBPATH_ARGS+=("-libpath=$prefix/lib")
            [[ -d "$prefix/Frameworks" ]] && LIBPATH_ARGS+=("-libpath=$prefix/Frameworks")
          done < <(brew list --formula | sort -u)

          "$QT_PREFIX/bin/macdeployqt" "$APP" -verbose=2 -always-overwrite "${LIBPATH_ARGS[@]}"
          # Qt Virtual Keyboard is GPL-3.0 only in Qt's open source edition, and NyxMap has no use for it: macdeployqt
          # copies it with the input context plugins, take it out before the dependencies are resolved
          rm -rf "$APP"/Contents/Frameworks/QtVirtualKeyboard*.framework "$APP/Contents/PlugIns/virtualkeyboard" \
            "$APP"/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin*.dylib

          # Open Media Transport (MIT, built from source, universal): in Frameworks, where NyxMap looks for it first
          python3 scripts/build_omt.py "$RUNNER_TEMP/omt"
          cp "$RUNNER_TEMP/omt/libomt.dylib" "$RUNNER_TEMP/omt/libvmx.dylib" "$APP/Contents/Frameworks/"
          cp "$RUNNER_TEMP/omt/OMT-LICENSES.txt" "$APP/Contents/Resources/"
          # The NDI runtime from the NDI SDK (its EULA accepted for NyxMap), with its licences and notice
          python3 scripts/fetch_ndi.py "$RUNNER_TEMP/ndi"
          cp "$RUNNER_TEMP/ndi/libndi.dylib" "$APP/Contents/Frameworks/"
          cp "$RUNNER_TEMP/ndi/Processing.NDI.Lib.Licenses.txt" "$RUNNER_TEMP/ndi/NDI-NOTICE.txt" "$APP/Contents/Resources/"
          cat "$RUNNER_TEMP/ndi/NDI-SDK.txt" >> deps-macos.txt

          # Resolve and bundle every non-system dependency recursively, including @rpath libraries
          # (e.g. WebP -> SharpYUV). The helper fails closed when a dependency is missing/ambiguous.
          python3 scripts/macos_bundle_deps.py "$APP"
          # This project is distributed without a paid Apple Developer account:
          # use an ad-hoc signature for bundle integrity only. This is NOT Developer ID
          # signing and cannot bypass Gatekeeper for quarantined downloads.
          while IFS= read -r -d '' binary; do
            file "$binary" | grep -q "Mach-O" || continue
            codesign --force --sign - "$binary"
          done < <(find "$APP/Contents/Frameworks" "$APP/Contents/PlugIns" -type f -print0)

          # Qt WebEngine (the Web Page generator): macdeployqt deploys QtWebEngineCore.framework with its helper
          # process and its resources; a build with it must have them
          if [[ -d "$APP/Contents/Frameworks/QtWebEngineCore.framework" ]]; then
            test -n "$(find "$APP/Contents/Frameworks/QtWebEngineCore.framework" -path '*Helpers/QtWebEngineProcess.app' -print -quit)"
            test -n "$(find "$APP/Contents/Frameworks/QtWebEngineCore.framework" -name 'qtwebengine_resources.pak' -print -quit)"
          fi

          # Sign framework/plugin bundles after their inner Mach-O files, deepest bundles first.
          while IFS= read -r -d '' bundle; do
            codesign --force --sign - "$bundle"
          done < <(find "$APP/Contents/Frameworks" "$APP/Contents/PlugIns" -depth -type d \( -name "*.framework" -o -name "*.bundle" \
            -o -name "*.app" \) -print0) # *.app: Qt WebEngine's helper, QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app

          # Sign the executable and outer app last, then verify bundle integrity.
          codesign --force --sign - "$EXE"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # No absolute Homebrew references may remain in the packaged Mach-O files.
          while IFS= read -r -d '' binary; do
            file "$binary" | grep -q "Mach-O" || continue
            if otool -L "$binary" | grep -E '/opt/homebrew/(Cellar|opt)/|/usr/local/(Cellar|opt)/'; then
              echo "Non-portable Homebrew dependency found in: $binary" >&2
              exit 1
            fi
          done < <(find "$APP/Contents" -type f -print0)
          test -x "$EXE"
          test -d "$APP/Contents/Resources/isf"
          cp LICENSE THIRD-PARTY-NOTICES.md "$APP/Contents/Resources/" && cp -R licenses "$APP/Contents/Resources/licenses"
          # Only LGPL FFmpeg libraries and no GPL-only one; the notices of every library copied from Homebrew
          python3 scripts/build_ffmpeg_lgpl.py check "$APP"
          python3 scripts/macos_notices.py "$APP"
          cat > "$APP/Contents/Resources/README-Dependencies.txt" <<'EOF'
          NyxMap macOS runtime notes

          The application bundle includes the Qt frameworks/plugins deployed by macdeployqt and the FFmpeg
          dynamic libraries discovered during packaging. The workflow checks for unresolved absolute Homebrew paths.

          OMT (Open Media Transport) is included: libomt and libvmx in Contents/Frameworks, built from
          source (MIT licences in Contents/Resources/OMT-LICENSES.txt).

          NDI is included: libndi.dylib in Contents/Frameworks, from the NDI SDK under its licence agreement
          (Contents/Resources/NDI-NOTICE.txt and Processing.NDI.Lib.Licenses.txt).

          Blackmagic DeckLink still requires the Blackmagic Desktop Video driver, installed separately.
          EOF
          # The archive is intentionally not notarized. macOS users may need to approve
          # this app manually because it is not signed with a paid Developer ID certificate.
          cat > "$APP/Contents/Resources/README-macOS-First-Launch.txt" <<'EOF'
          NyxMap macOS — first launch

          This build is not signed with an Apple Developer ID certificate and is not notarized.
          macOS may block the app when it is downloaded from the Internet.

          First try: in Finder, Control-click NyxMap.app, choose Open, then confirm Open.
          If macOS still says the app is damaged, only if you trust this build, open Terminal
          and run the following command on the extracted app:
            xattr -dr com.apple.quarantine "/path/to/NyxMap.app"
          Replace /path/to/NyxMap.app with the actual path to NyxMap.app, then open it again.

          This removes the download quarantine flag; it does not repair a genuinely corrupted
          application. Do not run this command on software from an untrusted source.
          EOF
          TAG_SUFFIX=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG_SUFFIX="-$GITHUB_REF_NAME"; fi
          cp deps-macos.txt "$APP/Contents/Resources/DEPENDENCIES.txt"
          codesign --force --sign - "$APP" # the resource added: sealed again
          ditto -c -k --keepParent "$APP" "NyxMap-macos${TAG_SUFFIX}.zip"
      - name: Smoke test of the extracted app
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && ditto -x -k NyxMap-macos*.zip "$RUNNER_TEMP/clean"
          APP="$RUNNER_TEMP/clean/NyxMap.app"
          codesign --verify --deep --strict "$APP"
          python3 scripts/smoke_package.py "$APP/Contents/MacOS/NyxMap" "$APP/Contents/Resources/isf" \
            "$PWD/test/media" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: NyxMap-macos
          path: NyxMap-macos*.zip

  windows:
    if: needs.scope.outputs.build == 'true'
    name: Windows (MSVC 2022) + tests
    runs-on: windows-2022
    needs: [scope, media]
    env:
      # Avoid the daily deletion/re-upload window of BtbN's mutable "latest" assets. Pin a month-end autobuild:
      # BtbN prunes its daily releases after about two weeks but keeps the last one of each month much longer.
      FFMPEG_ZIP: ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1
      FFMPEG_RELEASE: autobuild-2026-09-30-13-08
      FFMPEG_SHA256: 3e47bda1607740550141e37c0e49d1e5182b34699f15adfd137ee266d346811a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v4 # OMT: libomt is built with .NET Native AOT
        with:
          dotnet-version: '8.0.x'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          # Qt WebEngine (the Web Page generator) and the modules aqt needs installed with it
          modules: 'qtmultimedia qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_RELEASE/$env:FFMPEG_ZIP.zip" -OutFile ffmpeg.zip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg archive checksum mismatch"
          }
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
      - name: Build
        shell: pwsh
        run: |
          # pwsh stops on cmdlet errors only: every native command's exit code is checked
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="C:\ffmpeg\$env:FFMPEG_ZIP" -DNYXMAP_ACCEPT_TOUCHENGINE_LICENSE=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "NyxMap build failed" }
          cmake --build build --target nyxmap_tests
          if ($LASTEXITCODE -ne 0) { throw "Test build failed" }
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      # No GPU on the runner: Mesa's software OpenGL (llvmpipe, OpenGL 4.5)
      - uses: ssciwr/setup-mesa-dist-win@v2
      - name: Engine tests
        shell: pwsh
        env:
          LP_NUM_THREADS: '1' # the software GPU on one core: the sound's threads keep their time
        run: |
          $env:PATH = "C:\ffmpeg\$env:FFMPEG_ZIP\bin;$env:PATH"
          # Deterministic areas once; timing failures gate on their first attempt, with diagnostic rerun only
          ctest --test-dir build --output-on-failure --timeout 900 -LE timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_timing_tests.py ctest --test-dir build --output-on-failure --timeout 900 -L timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package with runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build\NyxMap.exe dist\NyxMap.exe -Force
          Copy-Item build\TouchEngine.dll dist\TouchEngine.dll -Force
          Copy-Item -Recurse -Force build\isf dist\isf
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md -Destination dist -Force
          Copy-Item -Recurse -Force licenses dist\licenses

          # Deploy Qt libraries, platform plugins, multimedia plugins and the MSVC runtime.
          # Use NyxMap's FFmpeg DLLs, not Qt Multimedia's private FFmpeg build.
          # Keep the official MSVC redistributable installer in the archive instead of copying
          # compiler-runtime DLLs individually.
          windeployqt --release --no-compiler-runtime --no-ffmpeg -multimedia dist\NyxMap.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # Bundle the FFmpeg DLL set used by this build, including companion DLLs.
          $ffmpegBin = "C:\ffmpeg\$env:FFMPEG_ZIP\bin"
          if (-not (Test-Path $ffmpegBin)) {
            throw "FFmpeg runtime directory not found: $ffmpegBin"
          }
          $ffmpegDlls = @(Get-ChildItem "$ffmpegBin\*.dll")
          if ($ffmpegDlls.Count -eq 0) {
            throw "No FFmpeg DLLs found in $ffmpegBin"
          }
          $ffmpegDlls | Copy-Item -Destination dist -Force
          # Only LGPL FFmpeg, as on macOS and Linux: v2.1 or later, or v3 or later (BtbN's lgpl builds may use
          # --enable-version3; licenses\LGPL-3.0.txt is in the package), never GPL or non-free parts
          $ffmpegCheck = @(python scripts/build_ffmpeg_lgpl.py check-dlls dist)
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg DLL licence check failed" }
          $ffmpegCheck
          $ffmpegLicence = $ffmpegCheck[-1]

          # Open Media Transport (MIT, built from source): next to NyxMap.exe, where NyxMap looks for it first
          python scripts/build_omt.py "$env:RUNNER_TEMP\omt"
          if ($LASTEXITCODE -ne 0) { throw "OMT build failed" }
          Copy-Item "$env:RUNNER_TEMP\omt\libomt.dll", "$env:RUNNER_TEMP\omt\libvmx.dll", "$env:RUNNER_TEMP\omt\OMT-LICENSES.txt" -Destination dist -Force

          # The NDI runtime from the NDI SDK (its EULA accepted for NyxMap), with its licences and notice
          python scripts/fetch_ndi.py "$env:RUNNER_TEMP\ndi"
          if ($LASTEXITCODE -ne 0) { throw "NDI fetch failed" }
          Copy-Item "$env:RUNNER_TEMP\ndi\Processing.NDI.Lib.x64.dll", "$env:RUNNER_TEMP\ndi\Processing.NDI.Lib.Licenses.txt", "$env:RUNNER_TEMP\ndi\NDI-NOTICE.txt" -Destination dist -Force

          # Include Microsoft's official x64 Visual C++ Redistributable installer.
          # aka.ms always serves the latest one, so no fixed checksum: its Authenticode signature must be valid and
          # Microsoft's, and its version and SHA-256 are recorded in DEPENDENCIES.txt
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist\vc_redist.x64.exe"
          $vcSignature = Get-AuthenticodeSignature "dist\vc_redist.x64.exe"
          if ($vcSignature.Status -ne 'Valid' -or $vcSignature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "vc_redist.x64.exe: signature $($vcSignature.Status), signer '$($vcSignature.SignerCertificate.Subject)'"
          }
          $vcVersion = (Get-Item "dist\vc_redist.x64.exe").VersionInfo.FileVersion
          $vcSha = (Get-FileHash "dist\vc_redist.x64.exe" -Algorithm SHA256).Hash
          "vc_redist.x64.exe $vcVersion, SHA-256 $vcSha, signed by $($vcSignature.SignerCertificate.Subject)"

          # Basic packaging assertions.
          if (-not (Test-Path dist\NyxMap.exe)) { throw "NyxMap.exe missing" }
          if (-not (Test-Path dist\isf)) { throw "ISF assets missing" }
          if (-not (Test-Path dist\platforms\qwindows.dll)) {
            throw "Qt Windows platform plugin missing after windeployqt"
          }
          if (-not (Get-ChildItem dist -Filter "*.dll")) {
            throw "No runtime DLLs were deployed"
          }
          # Qt WebEngine (the Web Page generator): windeployqt deploys Chromium's helper process, resources and locales
          # next to Qt6WebEngineCore.dll; the whole dist folder goes into the archive
          if (Test-Path dist\Qt6WebEngineCore.dll) {
            foreach ($f in @("QtWebEngineProcess.exe", "resources\qtwebengine_resources.pak", "translations\qtwebengine_locales\en-US.pak")) {
              if (-not (Test-Path "dist\$f")) { throw "Qt WebEngine file missing after windeployqt: $f" }
            }
          }

          @'
          NyxMap Windows x64 runtime notes

          This archive bundles NyxMap.exe, Qt runtime libraries/plugins, FFmpeg DLLs, ISF shaders,
          and Microsoft's official vc_redist.x64.exe installer.
          If Windows reports that the Visual C++ runtime is missing, run vc_redist.x64.exe, then start NyxMap.exe.
          Run NyxMap.exe from this extracted directory.

          OMT (Open Media Transport) is included: libomt.dll and libvmx.dll, built from source
          (MIT licences in OMT-LICENSES.txt).

          NDI is included: Processing.NDI.Lib.x64.dll from the NDI SDK under its licence agreement
          (NDI-NOTICE.txt and Processing.NDI.Lib.Licenses.txt).

          Some optional hardware features may require vendor software installed separately:
          - Blackmagic DeckLink: Blackmagic Desktop Video driver/runtime.

          These vendor runtimes are not part of this repository and are not bundled automatically.
          '@ | Set-Content -Encoding utf8 dist\README-Dependencies.txt

          # The FFmpeg build actually used (BtbN's archive is rebuilt daily: its version and checksum, to rebuild it)
          $ffv = (& "$ffmpegBin\ffmpeg.exe" -version | Select-Object -First 1)
          if (-not $ffv) { throw "ffmpeg -version failed" }
          $sha = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          @("Built on Windows (MSVC 2022), commit $env:GITHUB_SHA", "Qt 6.8.3 (win64_msvc2022_64, Qt Multimedia, Qt WebEngine)",
            "FFmpeg: $env:FFMPEG_ZIP from BtbN/FFmpeg-Builds release '$env:FFMPEG_RELEASE'", "  $ffv", "  zip SHA-256 $sha",
            "  licence of the DLLs: $ffmpegLicence (no GPL or non-free parts)",
            "Microsoft Visual C++ Redistributable: vc_redist.x64.exe $vcVersion", "  SHA-256 $vcSha",
            "  signed by $($vcSignature.SignerCertificate.Subject)",
            (Get-Content "$env:RUNNER_TEMP\ndi\NDI-SDK.txt")) |
            Set-Content -Encoding utf8 dist\DEPENDENCIES.txt
          Add-Content dist\DEPENDENCIES.txt "TouchEngine Windows SDK af3e4a393086c0377cd3634172a0ce18d1a654c8 (Shared Use License; licenses/touchengine.txt)"
          Get-Content dist\DEPENDENCIES.txt

          $tagSuffix = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") { $tagSuffix = "-$env:GITHUB_REF_NAME" }
          Compress-Archive -Path dist\* -DestinationPath "NyxMap-windows$tagSuffix.zip" -Force
      - name: Smoke test of the extracted archive
        shell: pwsh
        run: |
          # Extracted elsewhere, with neither FFmpeg's nor Qt's folders in PATH: only what the archive holds
          $clean = Join-Path $env:RUNNER_TEMP "clean"
          Expand-Archive (Get-ChildItem NyxMap-windows*.zip | Select-Object -First 1).FullName -DestinationPath $clean -Force
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'ffmpeg|Qt' }) -join ';'
          # OpenGL comes from Mesa installed on the runner; without it the program still has to start (exit code 1)
          python scripts/smoke_package.py "$clean\NyxMap.exe" "$clean\isf" "$PWD\test\media" "$env:RUNNER_TEMP\smoke" --allow-no-gl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NyxMap-windows
          path: NyxMap-windows*.zip


  open-stage-control:
    name: Release Open Stage Control remote
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/open-stage-control.yml

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows, validation, open-stage-control]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: NyxMap-*
          merge-multiple: false
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NyxMap ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.AppImage

  # A release published with GITHUB_TOKEN does not trigger another release
  # workflow. Call it explicitly once all package uploads have completed.
  release-metadata:
    if: github.ref_type == 'tag'
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-metadata.yml

  validation:
    name: Validation
    if: always()
    needs: [scope, media, linux, macos, windows, workspace-memory, workspace-valgrind, tsan, ui, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          failed = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] not in ('success', 'skipped')]
          if failed:
              sys.exit('Validation failed: ' + ', '.join(failed))
          PYTHON
